<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogoteca</title>
<meta name="description" content="Jogoteca: jogue jogos web direto no navegador. Protótipo acadêmico.">
<meta name="theme-color" content="#0c0d14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   JOGOTECA v4 — estilo portal de jogos web (inspirado no CrazyGames)
   Layout: celular = topo com busca + barra inferior;
           computador = barra lateral de categorias + conteúdo.
   ========================================================= */
:root {
  --fundo: #0c0d14;
  --fundo-2: #13141f;       /* barra lateral e topo */
  --painel: #1d1e2c;        /* cards e campos */
  --painel-2: #282a3d;      /* hover */
  --linha: #2e3047;
  --texto: #f4f4fb;
  --texto-suave: #a9abc9;
  --roxo: #7b5cff;          /* cor da marca */
  --roxo-2: #5d3df0;
  --verde: #3cdc7c;         /* botão Jogar */
  --verde-2: #22b85f;
  --sobre-verde: #062413;
  --rosa: #ff4f9a;
  --amarelo: #ffc93c;

  --f: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --raio: 14px;
  --raio-sm: 10px;
  --topo: 60px;
  --lateral: 76px;
  --tabbar: 62px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--f); font-size: 15px; line-height: 1.45; color: var(--texto);
  background: var(--fundo);
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { margin: 0; line-height: 1.15; font-weight: 900; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
svg { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--roxo); outline-offset: 2px; border-radius: 8px; }

/* ---------- Topo: logo + busca no centro ---------- */
.topo {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 12px;
  height: calc(var(--topo) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  background: var(--fundo-2); border-bottom: 1px solid var(--linha);
}
.logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; flex: none; }
.logo__mark {
  display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px;
  background: linear-gradient(135deg, var(--roxo), var(--rosa)); color: #fff; font-size: 18px; font-weight: 900;
}
.logo__text { display: none; font-weight: 900; font-size: 19px; letter-spacing: .01em; line-height: 1; }
.logo__text small { display: block; font-size: 11px; letter-spacing: .2em; color: var(--texto-suave); }

.busca-topo { flex: 1; min-width: 0; max-width: 560px; margin: 0 auto; position: relative; }
.busca-topo input {
  width: 100%; height: 42px; padding: 0 44px 0 16px; border: 1px solid transparent; border-radius: 999px;
  background: var(--painel); color: var(--texto); font: 600 16px var(--f); outline: none;
}
.busca-topo input::placeholder { color: var(--texto-suave); }
.busca-topo input:focus { border-color: var(--roxo); background: var(--painel-2); }
.busca-topo button {
  position: absolute; right: 4px; top: 4px; width: 34px; height: 34px; border: 0; border-radius: 50%;
  display: grid; place-items: center; background: transparent; cursor: pointer;
}
.busca-topo svg { width: 18px; height: 18px; fill: var(--texto-suave); }

.icone-topo {
  position: relative; flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
  background: var(--painel); text-decoration: none;
}
.icone-topo svg { width: 19px; height: 19px; fill: var(--texto); }
.contador {
  position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--rosa); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center;
}

/* ---------- Barra lateral (computador) ---------- */
.lateral { display: none; }
.lateral a {
  display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 14px; border-radius: 12px;
  text-decoration: none; color: var(--texto-suave); font-weight: 800; font-size: 14px; white-space: nowrap;
}
.lateral a:hover { background: var(--painel); color: var(--texto); }
.lateral a[aria-current="page"] { background: var(--painel-2); color: var(--texto); }
.lateral a[aria-current="page"] svg { fill: var(--roxo); }
.lateral svg { width: 22px; height: 22px; flex: none; fill: currentColor; }
.lateral hr { border: 0; border-top: 1px solid var(--linha); margin: 8px 6px; }
.lateral span { opacity: 0; transition: opacity .15s; }

/* ---------- Barra inferior (celular) ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(4, 1fr);
  height: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: var(--fundo-2); border-top: 1px solid var(--linha);
}
.tabbar a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 800; color: var(--texto-suave); }
.tabbar svg { width: 23px; height: 23px; fill: currentColor; }
.tabbar a[aria-current="page"] { color: var(--texto); }
.tabbar a[aria-current="page"] svg { fill: var(--roxo); }
.tabbar .contador { top: 6px; right: calc(50% - 22px); }

/* ---------- Conteúdo ---------- */
main {
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
  outline: none; min-width: 0;
}
.miolo { max-width: 1280px; margin: 0 auto; }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px;
  font: 900 15px var(--f); text-decoration: none; white-space: nowrap; cursor: pointer; transition: transform .12s, filter .2s;
}
.btn:active { transform: scale(.96); }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn--jogar { background: linear-gradient(180deg, var(--verde), var(--verde-2)); color: var(--sobre-verde); box-shadow: 0 6px 20px rgba(60, 220, 124, .3); }
.btn--jogar:hover { filter: brightness(1.08); }
.btn--roxo { background: var(--roxo); color: #fff; }
.btn--roxo:hover { background: var(--roxo-2); }
.btn--cinza { background: var(--painel); color: var(--texto); }
.btn--cinza:hover { background: var(--painel-2); }
.btn--cinza[aria-pressed="true"] { color: var(--rosa); }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Blocos de "humor" (Treinar o cérebro, Adrenalina...) ---------- */
.humores {
  display: grid; grid-auto-flow: column; grid-auto-columns: 46%; gap: 10px;
  overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
  margin: 0 -16px 22px; padding: 0 16px;
}
.humores::-webkit-scrollbar { display: none; }
.humores, .fileira, .chips { scroll-padding-inline: 16px; }
.humor {
  scroll-snap-align: start; position: relative; overflow: hidden; display: flex; align-items: flex-end;
  height: 86px; padding: 12px; border-radius: var(--raio); text-decoration: none;
  background: linear-gradient(135deg, var(--h1), var(--h2)); font-weight: 900; font-size: 15px; line-height: 1.1;
}
.humor::after { content: ""; position: absolute; right: -18px; top: -18px; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,.18); }
.humor svg { position: absolute; right: 12px; top: 12px; width: 30px; height: 30px; fill: rgba(255,255,255,.9); z-index: 1; }
.humor:hover { filter: brightness(1.1); }

/* ---------- Seções e fileiras ---------- */
.secao { margin-top: 24px; }
.secao__cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.secao__cab h2 { font-size: 19px; }
.secao__cab a { color: var(--texto-suave); font-weight: 800; font-size: 13px; text-decoration: none; white-space: nowrap; }
.secao__cab a:hover { color: var(--texto); }

.fileira {
  list-style: none; margin: 0 -16px; padding: 0 16px 6px;
  display: grid; grid-auto-flow: column; grid-auto-columns: 42%; gap: 10px;
  overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none;
}
.fileira::-webkit-scrollbar { display: none; }
.fileira > li { scroll-snap-align: start; min-width: 0; }

.grade { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grade > li { min-width: 0; }

/* ---------- Miniatura de jogo (thumbnail) ---------- */
.mini { position: relative; display: block; text-decoration: none; border-radius: var(--raio-sm); }
.mini .capa { border-radius: var(--raio-sm); transition: transform .18s, box-shadow .18s; }
.mini:hover .capa, .mini:focus-visible .capa { transform: translateY(-3px) scale(1.02); box-shadow: 0 0 0 3px var(--roxo), 0 12px 30px rgba(0,0,0,.5); }
.mini__nome {
  display: block; margin-top: 6px; font-weight: 800; font-size: 13px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.mini__genero { display: block; font-size: 12px; color: var(--texto-suave); font-weight: 600; }
.selo {
  position: absolute; left: 6px; top: 6px; z-index: 2; padding: 2px 8px; border-radius: 6px;
  font-size: 11px; font-weight: 900; letter-spacing: .02em; text-transform: uppercase;
  background: var(--rosa); color: #fff;
}
.selo--novo { background: var(--verde); color: var(--sobre-verde); }
.coracao {
  position: absolute; right: 6px; top: 6px; z-index: 2;
  display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(12, 13, 20, .65); backdrop-filter: blur(6px);
}
.coracao svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2.2; }
.coracao[aria-pressed="true"] { background: var(--rosa); }
.coracao[aria-pressed="true"] svg { fill: #fff; }

/* Capa desenhada em CSS — sem texto, como pedem os portais de jogos */
.capa {
  position: relative; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; isolation: isolate;
  background: radial-gradient(circle at 30% 20%, var(--c2), var(--c1) 70%);
}
.capa__sol { position: absolute; right: -12%; bottom: -30%; width: 70%; aspect-ratio: 1; border-radius: 50%; background: var(--c3); opacity: .9; z-index: -1; }
.capa__chao { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: rgba(0,0,0,.25); z-index: -1; }
.capa__icone { position: absolute; left: 50%; top: 46%; width: 40%; aspect-ratio: 1; transform: translate(-50%, -50%) rotate(-8deg); }
.capa__icone svg { width: 100%; height: 100%; fill: #fff; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); }
.capa__arte { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* ---------- Destaque grande ("Top jogos hoje") ---------- */
.topo-hoje { display: grid; gap: 10px; }
.destaque {
  position: relative; display: block; overflow: hidden; border-radius: var(--raio); text-decoration: none;
}
.destaque .capa { aspect-ratio: 16 / 9; }
.destaque__info {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding: 40px 14px 14px; background: linear-gradient(transparent, rgba(0,0,0,.8));
}
.destaque__info h3 { font-size: 22px; }
.destaque__info p { font-size: 13px; color: #d7d8ee; font-weight: 700; }
.destaque .btn { min-height: 40px; padding: 0 16px; flex: none; }

/* ---------- Páginas internas ---------- */
.cab-pagina { margin-bottom: 14px; }
.cab-pagina h1 { font-size: 26px; margin-bottom: 4px; }
.cab-pagina p { color: var(--texto-suave); font-weight: 600; font-size: 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 0 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 14px; border-radius: 999px; background: var(--painel); color: var(--texto-suave); font-weight: 800; font-size: 13px; text-decoration: none; white-space: nowrap; }
.chip:hover { color: var(--texto); background: var(--painel-2); }
.chip[aria-current="page"] { background: var(--roxo); color: #fff; }
.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; font-size: 13px; font-weight: 700; color: var(--texto-suave); }
.vazio { padding: 28px 16px; text-align: center; color: var(--texto-suave); font-weight: 600; background: var(--painel); border-radius: var(--raio); }
.vazio strong { display: block; color: var(--texto); font-size: 18px; font-weight: 900; margin-bottom: 4px; }
.link-texto { background: none; border: 0; padding: 0; color: var(--roxo); font-weight: 900; text-decoration: underline; cursor: pointer; }

.pag { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.pag__item { display: inline-grid; place-items: center; min-width: 44px; min-height: 42px; padding: 0 14px; border-radius: 999px; background: var(--painel); font-weight: 900; text-decoration: none; }
.pag__item:hover { background: var(--painel-2); }
.pag__item--ativo { background: var(--roxo); color: #fff; }
.pag__item--desab { opacity: .4; pointer-events: none; }

/* ---------- Página do jogo ---------- */
.migalhas { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; font-weight: 700; color: var(--texto-suave); margin-bottom: 12px; }
.migalhas a { text-decoration: none; }
.migalhas a:hover { color: var(--texto); }
.jogo { display: grid; gap: 16px; }
.jogo__tela { position: relative; overflow: hidden; border-radius: var(--raio); }
.jogo__tela .capa { aspect-ratio: 16 / 9; }
.jogo__tela .btn { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); min-height: 54px; padding: 0 30px; font-size: 17px; }
.jogo__tela .btn:active { transform: translate(-50%, -50%) scale(.96); }
.jogo__info { display: grid; gap: 12px; min-width: 0; align-content: start; }
.jogo__info h1 { font-size: 30px; }
.jogo__desc { color: #d0d1e8; font-weight: 600; max-width: 62ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--painel); color: var(--texto-suave); text-decoration: none; }
a.tag:hover { color: var(--texto); }
.ficha { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; padding: 14px; background: var(--painel); border-radius: var(--raio-sm); }
.ficha dt { color: var(--texto-suave); font-weight: 700; }
.ficha dd { margin: 0; font-weight: 800; }
.disp { color: var(--verde); }
.aviso { margin-top: 20px; padding: 14px 16px; border-radius: var(--raio-sm); background: var(--painel); border-left: 4px solid var(--roxo); }
.aviso h2 { font-size: 15px; margin-bottom: 2px; }
.aviso p { font-size: 13px; color: var(--texto-suave); font-weight: 600; }

/* ---------- Tela de acesso (carregando) ---------- */
.palco {
  position: relative; overflow: hidden; display: grid; place-items: center; align-content: center; text-align: center; gap: 14px;
  min-height: 320px; padding: 30px 20px; margin-bottom: 18px; border-radius: var(--raio);
  background: radial-gradient(circle at 30% 20%, var(--c2), var(--c1) 75%);
}
.palco__icone { width: 84px; height: 84px; animation: pular 1.2s ease-in-out infinite; }
.palco__icone svg { width: 100%; height: 100%; fill: #fff; filter: drop-shadow(0 6px 0 rgba(0,0,0,.25)); }
.palco h2 { font-size: 28px; }
.palco p { color: rgba(255,255,255,.85); font-weight: 700; font-size: 14px; }
.carregando { width: min(280px, 80%); height: 12px; border-radius: 6px; background: rgba(0,0,0,.35); overflow: hidden; }
.carregando span { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--verde); animation: carregar 2s ease-out forwards; }
@keyframes carregar { to { width: 100%; } }
@keyframes pular { 50% { transform: translateY(-10px); } }

.rodape { margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--linha); font-size: 12px; font-weight: 600; color: var(--texto-suave); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* =========================================================
   Tablet (≥600px)
   ========================================================= */
@media (min-width: 600px) {
  .logo__text { display: block; }
  .humores { grid-auto-columns: 30%; }
  .fileira { grid-auto-columns: 28%; }
  .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .topo-hoje { grid-template-columns: 1.6fr 1fr; }
  .topo-hoje .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; }
  .jogo__info h1 { font-size: 34px; }
}

/* =========================================================
   Computador (≥960px): barra lateral, some a barra inferior
   ========================================================= */
@media (min-width: 960px) {
  body { padding-bottom: 0; padding-left: var(--lateral); }
  .tabbar { display: none; }
  .lateral {
    display: flex; flex-direction: column; gap: 2px;
    position: fixed; left: 0; top: var(--topo); bottom: 0; z-index: 25;
    width: var(--lateral); padding: 10px; overflow: hidden auto;
    background: var(--fundo-2); border-right: 1px solid var(--linha);
    transition: width .2s;
  }
  .lateral:hover, .lateral:focus-within { width: 230px; box-shadow: 20px 0 40px rgba(0,0,0,.4); }
  .lateral:hover span, .lateral:focus-within span { opacity: 1; }
  .topo { margin-left: calc(-1 * var(--lateral)); }
  main { padding: 22px 28px 56px; }
  .humores { grid-auto-flow: row; grid-template-columns: repeat(5, 1fr); grid-auto-columns: auto; margin: 0 0 24px; padding: 0; overflow: visible; }
  .humor { height: 100px; font-size: 17px; }
  .fileira { margin: 0; padding: 0 0 6px; grid-auto-columns: calc((100% - 50px) / 6); gap: 10px; }
  .grade { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .topo-hoje .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chips { margin: 0 0 16px; padding: 0; flex-wrap: wrap; overflow: visible; }
  .jogo { grid-template-columns: 1.5fr 1fr; gap: 28px; }
  .cab-pagina h1 { font-size: 32px; }
}
</style>
</head>
<body>

<header class="topo">
  <a class="logo" href="#inicio" aria-label="Jogoteca, ir para o início">
    <span class="logo__mark" aria-hidden="true">J</span>
    <span class="logo__text">JOGOTECA<small>JOGOS WEB</small></span>
  </a>
  <form class="busca-topo" role="search" data-busca>
    <label class="sr-only" for="busca-topo">Buscar jogos</label>
    <input id="busca-topo" name="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Buscar jogos e gêneros">
    <button type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg></button>
  </form>
  <a class="icone-topo" href="#desejos" data-contador aria-label="Lista de desejos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.3-4.4-9.3-8.9C1.3 8.4 3.3 5 6.6 5c2 0 3.5 1.1 4.3 2.5h2.2C13.9 6.1 15.4 5 17.4 5c3.3 0 5.3 3.4 3.9 6.6-2 4.5-9.3 8.9-9.3 8.9z"/></svg>
  </a>
</header>

<nav class="lateral" id="lateral" aria-label="Categorias"></nav>

<main id="conteudo" tabindex="-1"></main>

<nav class="tabbar" aria-label="Navegação">
  <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>

      '<g fill="#fff"><ellipse cx="70" cy="170" rx="70" ry="16"/><ellipse cx="260" cy="180" rx="80" ry="18"/><ellipse cx="170" cy="190" rx="60" ry="12"/></g>' +
      '<g><path d="M30 96h90l-18 40H52z" fill="#7a5a3a"/><path d="M30 96h90" stroke="#5ab86a" stroke-width="8" stroke-linecap="round"/><path d="M60 92l10-22 10 22z" fill="#3c9a50"/><path d="M84 92l8-16 8 16z" fill="#5ab86a"/></g>' +
      '<g><path d="M214 64h70l-14 30h-42z" fill="#7a5a3a"/><path d="M214 64h70" stroke="#5ab86a" stroke-width="7" stroke-linecap="round"/><path d="M240 60l9-18 9 18z" fill="#3c9a50"/></g>' +
      '<path d="M120 100Q170 120 214 70" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 5" opacity=".8"/>' +
      '<g transform="translate(166 92) rotate(-12)"><path d="M-34 6L0-10 34 6 0 0z" fill="' + j.c3 + '" stroke="#ff8b5c" stroke-width="2"/><path d="M0 0v12" stroke="#2a3a4a" stroke-width="2"/><circle cx="0" cy="15" r="3.5" fill="#ff8b5c"/></g>' +
      '<g fill="#fff" opacity=".8"><ellipse cx="290" cy="130" rx="22" ry="6"/><ellipse cx="40" cy="40" rx="24" ry="6"/></g>',

    // tabuleiro em perspectiva com as fases da lua
    "xadrez-lunar": (j) => fundo("xl-c", "#05081c", j.c1) + estrelas(50, 22, "#fff", 90) +
      '<g fill="' + j.c3 + '"><circle cx="70" cy="40" r="10"/><circle cx="120" cy="34" r="10"/><circle cx="170" cy="32" r="10"/><circle cx="220" cy="34" r="10"/><circle cx="270" cy="40" r="10"/></g>' +
      '<g fill="#05081c"><circle cx="64" cy="40" r="10"/><circle cx="117" cy="34" r="10" opacity=".0"/><circle cx="226" cy="34" r="10"/><circle cx="278" cy="40" r="9"/></g>' +
      '<rect x="112" y="27" width="8" height="14" fill="#05081c"/>' +
      '<path d="M40 200L100 96h120l60 104z" fill="#1c2250"/>' +
      '<g fill="' + j.c3 + '" opacity=".9">' +
        '<path d="M100 96h30l-8 26H90z"/><path d="M160 96h30l4 26h-36z"/><path d="M76 138h38l-10 30H58z"/><path d="M152 138h38l6 30h-48z"/><path d="M226 138h20l18 30h-34z"/>' +
        '<path d="M130 122h36v16h-40z"/><path d="M200 122h28l6 16h-32z"/><path d="M58 168h46l-10 32H40z"/><path d="M148 168h48l4 32h-52z"/><path d="M236 168h28l16 32h-38z"/>' +
      '</g>' +
      '<g fill="#fff"><path d="M138 132h16l-3-6h-10z"/><circle cx="146" cy="118" r="6"/><rect x="142" y="122" width="8" height="6"/></g>' +
      '<g fill="#7a86d6"><path d="M196 162h20l-3-7h-14z"/><rect x="200" y="140" width="12" height="16" rx="3"/><path d="M198 140l8-10 8 10z"/></g>',

    // um mundo em forma de Y com caminhos e símbolos de enigma
    "ypsilon-quest": (j) => fundo("yq-c", j.c1, "#5a0a46") + estrelas(30, 23, "#fff", 80) +
      '<path d="M160 200V120L80 30M160 120l80-90" fill="none" stroke="' + j.c2 + '" stroke-width="40" stroke-linejoin="round"/>' +
      '<path d="M160 200V120L80 30M160 120l80-90" fill="none" stroke="#ff7ab8" stroke-width="2" stroke-dasharray="6 8"/>' +
      '<circle cx="160" cy="120" r="22" fill="' + j.c1 + '" stroke="' + j.c3 + '" stroke-width="3"/>' +
      '<path d="M152 112l8 8 8-8M160 120v10" stroke="' + j.c3 + '" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<g fill="' + j.c3 + '"><rect x="72" y="22" width="16" height="16" rx="3"/><circle cx="240" cy="30" r="9"/><path d="M160 186l9 9-9 9-9-9z"/></g>' +
      '<g fill="#fff" opacity=".85"><path d="M40 140h14v14H40z" transform="rotate(12 47 147)"/><path d="M274 150l8 14h-16z"/></g>',

    // dois aviões no alto do céu sobre o oceano
    "zenite-azul": (j) => fundo("za-c", j.c1, "#3a8ae6") +
      '<rect y="150" width="320" height="50" fill="#03204e"/><path d="M0 150h320" stroke="' + j.c3 + '" stroke-width="2" opacity=".6"/>' +
      '<g stroke="#fff" opacity=".35" stroke-width="2"><path d="M0 168h60M100 176h90M230 166h70M40 188h80M200 190h90"/></g>' +
      '<g fill="#fff" opacity=".7"><ellipse cx="60" cy="120" rx="40" ry="8"/><ellipse cx="260" cy="110" rx="46" ry="9"/></g>' +
      '<path d="M20 90L150 66" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"/>' +
      '<g transform="translate(160 64) rotate(-10)"><path d="M24 0L-14-4-20-14h-6l4 12-10 2 10 2-4 12h6l6-10 38-4z" fill="#e6f4ff"/><path d="M-2-2l-8-16h-6l6 16zM-2 2l-8 16h-6l6-16z" fill="#9cc7ef"/><path d="M8-2h10v4H8z" fill="' + j.c3 + '"/></g>' +
      '<path d="M330 40L230 104" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".4"/>' +
      '<g transform="translate(232 104) rotate(148) scale(.7)"><path d="M24 0L-14-4-20-14h-6l4 12-10 2 10 2-4 12h6l6-10 38-4z" fill="#ff8b9a"/><path d="M-2-2l-8-16h-6l6 16zM-2 2l-8 16h-6l6-16z" fill="#c95468"/></g>'
  };

  function arteCapa(j) {
    const desenho = CAPAS[j.slug];
    if (!desenho) return "";
    return '<svg class="capa__arte" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + desenho(j) + '</svg>';
  }
  // jogo sem desenho próprio: volta para a capa simples com o ícone do gênero
  function capaPadrao(j) {
    return '<span class="capa__sol"></span><span class="capa__chao"></span><span class="capa__icone">' + svg(ICONES[j.genero] || ICONES["Casual"]) + '</span>';
  }

  /* ---------- peças ---------- */
  function capa(j) {
    return `
      <div class="capa" style="--c1:${j.c1};--c2:${j.c2};--c3:${j.c3}" aria-hidden="true">
        ${arteCapa(j) || capaPadrao(j)}
      </div>`;
  }

  function selo(j) {
    if (NOVOS.has(j.slug)) return '<span class="selo selo--novo">Novo</span>';
    if (EM_ALTA.has(j.slug)) return '<span class="selo">Em alta</span>';
    return "";
  }

  function botaoDesejo(j) {
    const on = desejos.has(j.slug);
    return `<button type="button" class="coracao" data-desejo="${j.slug}" aria-pressed="${on}" aria-label="${on ? "Tirar" : "Pôr"} ${esc(j.titulo)} na lista de desejos">${svg(P_CORACAO)}</button>`;
  }

  function mini(j) {
    return `
      <li style="position:relative">
        <a class="mini" href="#jogo-${j.slug}">
          ${capa(j)}
          <span class="mini__nome">${esc(j.titulo)}</span>
          <span class="mini__genero">${esc(j.genero)}</span>
        </a>
        ${selo(j)}${botaoDesejo(j)}
      </li>`;
  }
  const grade = (l) => `<ul class="grade" role="list">${l.map(mini).join("")}</ul>`;
  const fileira = (l) => `<ul class="fileira" role="list">${l.map(mini).join("")}</ul>`;

  function chips(ativo) {
    return `<nav class="chips" aria-label="Gêneros">
      <a class="chip" href="#catalogo"${!ativo ? ' aria-current="page"' : ""}>Todos</a>
      ${GENEROS.map((g) => `<a class="chip" href="#genero-${normalizar(g)}"${ativo === normalizar(g) ? ' aria-current="page"' : ""}>${esc(g)}</a>`).join("")}
    </nav>`;
  }

  function desenharLateral(atual) {
    const item = (href, icone, nome) => `<a href="${href}"${atual === href ? ' aria-current="page"' : ""}>${svg(icone)}<span>${esc(nome)}</span></a>`;
    lateral.innerHTML =
      item("#inicio", P_CASA, "Início") +
      item("#catalogo", P_GRADE, "Todos os jogos") +
      item("#novos", P_NOVO, "Novidades") +
      item("#desejos", P_CORACAO, "Lista de desejos") +
      "<hr>" +
      GENEROS.map((g) => item(`#genero-${normalizar(g)}`, ICONES[g] || ICONES["Casual"], g)).join("");
  }

  /* ---------- 01 · HOME ---------- */
  function telaInicio() {
    const top = porSlug("orbita-zero");
    const lado = ["circuito-neon", "pixel-rush", "astro-arena", "floresta-luminosa"].map(porSlug);
    return {
      nav: "inicio", titulo: "Jogos web grátis",
      html: `
        <h1 class="sr-only">Jogoteca: jogos web</h1>
        <nav class="humores" aria-label="Escolha pelo seu humor">
          ${HUMORES.map((h) => `<a class="humor" href="#humor-${h.id}" style="--h1:${h.h1};--h2:${h.h2}">${svg(h.icone)}<span>${esc(h.nome)}</span></a>`).join("")}
        </nav>

        <section class="secao" style="margin-top:0">
          <div class="secao__cab"><h2>Top jogos hoje</h2><a href="#catalogo">Ver todos</a></div>
          <div class="topo-hoje">
            <a class="destaque" href="#jogo-${top.slug}">
              ${capa(top)}
              <span class="destaque__info">
                <span><h3>${esc(top.titulo)}</h3><p>${esc(top.genero)} · ${esc(top.classificacao)}</p></span>
                <span class="btn btn--jogar">${svg(P_PLAY)} Jogar</span>
              </span>
            </a>
            ${grade(lado)}
          </div>
        </section>

        ${SECOES.map((s) => `
          <section class="secao">
            <div class="secao__cab"><h2>${esc(s.titulo)}</h2><a href="${s.novo ? "#novos" : "#catalogo"}">Ver todos</a></div>
            ${fileira(s.slugs.map(porSlug))}
          </section>`).join("")}

        ${GENEROS.slice(0, 3).map((g) => `
          <section class="secao">
            <div class="secao__cab"><h2>Jogos de ${esc(g)}</h2><a href="#genero-${normalizar(g)}">Ver todos</a></div>
            ${fileira(ordenados.filter((j) => generoBase(j.genero) === g))}
          </section>`).join("")}

        <p class="rodape">Jogoteca · Protótipo acadêmico. Os jogos são fictícios.</p>`
    };
  }

  /* ---------- 02 · CATÁLOGO + filtros ---------- */
  function paginacao(atual) {
    const href = (n) => (n === 1 ? "#catalogo" : `#catalogo-${n}`);
    let h = `<a class="pag__item${atual === 1 ? " pag__item--desab" : ""}" href="${href(atual - 1)}">Anterior</a>`;
    for (let n = 1; n <= totalPaginas; n++) h += `<a class="pag__item${n === atual ? " pag__item--ativo" : ""}" href="${href(n)}"${n === atual ? ' aria-current="page"' : ""}>${n}</a>`;
    h += `<a class="pag__item${atual === totalPaginas ? " pag__item--desab" : ""}" href="${href(atual + 1)}">Próxima</a>`;
    return `<nav class="pag" aria-label="Paginação">${h}</nav>`;
  }

  function telaCatalogo(pagina) {
    pagina = Math.min(Math.max(pagina, 1), totalPaginas);
    return {
      nav: "catalogo", titulo: "Todos os jogos", lateral: "#catalogo",
      html: `
        <header class="cab-pagina"><h1>Todos os jogos</h1><p>Explore toda a coleção e encontre sua próxima aventura.</p></header>
        ${chips("")}
        <div class="meta"><span>${POR_PAGINA} jogos por página • Ordem alfabética (A–Z)</span><span>Página ${pagina} de ${totalPaginas} • ${ordenados.length} jogos</span></div>
        ${grade(ordenados.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA))}
        ${paginacao(pagina)}`
    };
  }

  function telaLista(titulo, sub, lista, ativoChip, lateralAtual) {
    return {
      nav: "catalogo", titulo, lateral: lateralAtual,
      html: `
        <header class="cab-pagina"><h1>${esc(titulo)}</h1><p>${esc(sub)}</p></header>
        ${ativoChip !== null ? chips(ativoChip) : ""}
        <div class="meta"><span>${lista.length} ${lista.length === 1 ? "jogo" : "jogos"}</span></div>
        ${grade(lista)}`
    };
  }

  function telaDesejos() {
    const lista = ordenados.filter((j) => desejos.has(j.slug));
    return {
      nav: "desejos", titulo: "Lista de desejos", lateral: "#desejos",
      html: `
        <header class="cab-pagina"><h1>Lista de desejos</h1><p>Os jogos que você marcou com o coração ficam salvos neste aparelho.</p></header>
        ${lista.length ? grade(lista) : `<div class="vazio"><strong>Sua lista está vazia</strong>Toque no coração de um jogo para guardar ele aqui.<div class="acoes" style="justify-content:center;margin-top:14px"><a class="btn btn--roxo" href="#catalogo">Ver jogos</a></div></div>`}`
    };
  }

  /* ---------- 03 · BUSCA ---------- */
  function telaBusca() {
    const termo = termoBusca.trim(), n = normalizar(termo);
    const res = n ? ordenados.filter((j) => normalizar(j.titulo).includes(n) || normalizar(j.genero).includes(n)) : [];
    let corpo;
    if (!termo) corpo = `<div class="vazio"><strong>O que você quer jogar?</strong>Digite o nome de um jogo ou um gênero na busca lá em cima. Exemplo: <button type="button" class="link-texto" data-exemplo="astro">astro</button></div>`;
    else if (!res.length) corpo = `<div class="vazio"><strong>Nada encontrado para “${esc(termo)}”</strong>Tente outro nome ou um gênero, como “corrida”.</div>`;
    else corpo = `<div class="meta"><span>${res.length} ${res.length === 1 ? "resultado" : "resultados"} para “${esc(termo)}”</span></div>${grade(res)}`;
    return {
      nav: "busca", titulo: "Buscar",
      html: `<header class="cab-pagina"><h1>Resultados da busca</h1><p>Busca por nome ou gênero, sem precisar de acento.</p></header><div aria-live="polite">${corpo}</div>`
    };
  }

  /* ---------- 04 · PÁGINA DO JOGO ---------- */
  function telaJogo(j) {
    const on = desejos.has(j.slug);
    const parecidos = JOGOS.filter((x) => generoBase(x.genero) === generoBase(j.genero) && x.slug !== j.slug);
    return {
      nav: "catalogo", titulo: j.titulo,
      html: `
        <nav class="migalhas" aria-label="Você está em"><a href="#inicio">Início</a><span aria-hidden="true">›</span><a href="#genero-${normalizar(generoBase(j.genero))}">${esc(generoBase(j.genero))}</a><span aria-hidden="true">›</span><span aria-current="page">${esc(j.titulo)}</span></nav>
        <article class="jogo">
          <div class="jogo__tela">
            ${capa(j)}
            <a class="btn btn--jogar" href="${JOGAVEIS[j.slug] || "#acesso-" + j.slug}">${svg(P_PLAY)} Jogar agora</a>
          </div>
          <div class="jogo__info">
            <h1>${esc(j.titulo)}</h1>
            <div class="tags"><a class="tag" href="#genero-${normalizar(generoBase(j.genero))}">${esc(j.genero)}</a><span class="tag">Navegador</span><span class="tag">Celular e PC</span><span class="tag">Grátis</span>${JOGAVEIS[j.slug] ? '<span class="tag" style="color:var(--verde)">Jogável de verdade</span>' : ""}</div>
            <p class="jogo__desc">${esc(j.descricao)}</p>
            <dl class="ficha">
              <dt>Gênero</dt><dd>${esc(j.genero)}</dd>
              <dt>Classificação etária</dt><dd>${esc(j.classificacao)}</dd>
              <dt>Disponibilidade</dt><dd class="disp">Disponível</dd>
            </dl>
            <div class="acoes">
              <button type="button" class="btn btn--cinza" data-desejo="${j.slug}" aria-pressed="${on}">${on ? "♥ Na lista de desejos" : "♡ Lista de desejos"}</button>
              <a class="btn btn--cinza" href="#catalogo">Voltar ao catálogo</a>
            </div>
          </div>
        </article>
        ${parecidos.length ? `<section class="secao"><div class="secao__cab"><h2>Jogos parecidos</h2></div>${fileira(parecidos)}</section>` : ""}
        <aside class="aviso"><h2>Fluxo demonstrativo</h2><p>A navegação e a abertura do jogo são simuladas. O registro real de acessos depende de uma implementação futura.</p></aside>`
    };
  }

  /* ---------- 05 · ACESSO ---------- */
  function telaAcesso(j) {
    return {
      nav: "catalogo", titulo: `Jogando ${j.titulo}`,
      html: `
        <section class="palco" style="--c1:${j.c1};--c2:${j.c2}">
          <span class="palco__icone" aria-hidden="true">${svg(ICONES[j.genero] || ICONES["Casual"])}</span>
          <h2>${esc(j.titulo)}</h2>
          <div class="carregando" role="progressbar" aria-label="Carregando o jogo"><span></span></div>
          <p>Carregando… Esta tela simula a abertura do jogo no navegador.</p>
        </section>
        <div class="acoes"><a class="btn btn--cinza" href="#jogo-${j.slug}">Voltar ao jogo</a><a class="btn btn--roxo" href="#inicio">Ir para o início</a></div>`
    };
  }

  /* ---------- roteador ---------- */
  function rota() {
    const h = location.hash.replace(/^#/, "");
    let m;
    if (!h || h === "inicio") return telaInicio();
    if (h === "catalogo") return telaCatalogo(1);
    if ((m = h.match(/^catalogo-(\d+)$/))) return telaCatalogo(+m[1]);
    if (h === "busca") return telaBusca();
    if (h === "desejos") return telaDesejos();
    if (h === "novos") return telaLista("Novidades", "Os jogos adicionados recentemente.", SECOES[2].slugs.map(porSlug), null, "#novos");
    if ((m = h.match(/^genero-([a-z-]+)$/))) {
      const g = GENEROS.find((x) => normalizar(x) === m[1]);
      if (g) return telaLista(`Jogos de ${g}`, `Todos os jogos do gênero ${g}.`, ordenados.filter((j) => generoBase(j.genero) === g), m[1], "#" + h);
    }
    if ((m = h.match(/^humor-([a-z]+)$/))) {
      const hu = HUMORES.find((x) => x.id === m[1]);
      if (hu) return telaLista(hu.nome, `Gêneros: ${hu.generos.join(" e ")}.`, ordenados.filter((j) => hu.generos.includes(generoBase(j.genero))), null, "");
    }
    if ((m = h.match(/^(jogo|acesso)-([a-z0-9-]+)$/)) && porSlug(m[2])) {
      return m[1] === "jogo" ? telaJogo(porSlug(m[2])) : telaAcesso(porSlug(m[2]));
    }
    return telaInicio();
  }

  function atualizarContador() {
    document.querySelectorAll("[data-contador]").forEach((a) => {
      let c = a.querySelector(".contador");
      if (desejos.size) {
        if (!c) { c = document.createElement("span"); c.className = "contador"; a.appendChild(c); }
        c.textContent = desejos.size;
      } else if (c) c.remove();
    });
  }

  let primeira = true;
  function render() {
    const tela = rota();
    app.innerHTML = `<div class="miolo">${tela.html}</div>`;
    document.title = `${tela.titulo} · Jogoteca`;
    document.querySelectorAll("[data-nav]").forEach((a) =>
      a.dataset.nav === tela.nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    desenharLateral(tela.lateral ?? (tela.nav === "inicio" ? "#inicio" : ""));
    atualizarContador();
    window.scrollTo(0, 0);
    if (!primeira) app.focus({ preventScroll: true });
    primeira = false;
  }

  function buscar(q) {
    termoBusca = q;
    document.getElementById("busca-topo").value = q;
    if (location.hash === "#busca") render(); else location.hash = "busca";
  }

  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-busca]");
    if (!f) return;
    e.preventDefault();
    f.q.blur();
    buscar(f.q.value);
  });

  document.addEventListener("click", (e) => {
    const ex = e.target.closest("[data-exemplo]");
    if (ex) { buscar(ex.dataset.exemplo); return; }
    const d = e.target.closest("[data-desejo]");
    if (!d) return;
    e.preventDefault();
    const s = d.dataset.desejo;
    if (desejos.has(s)) desejos.delete(s); else desejos.add(s);
    salvar();
    const on = desejos.has(s);
    document.querySelectorAll(`[data-desejo="${s}"]`).forEach((b) => {
      b.setAttribute("aria-pressed", String(on));
      if (b.classList.contains("btn")) b.textContent = on ? "♥ Na lista de desejos" : "♡ Lista de desejos";
    });
    atualizarContador();
    if (location.hash === "#desejos") render();
  });

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
