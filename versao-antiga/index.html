<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogoteca</title>
<meta name="description" content="Jogoteca: protótipo acadêmico de plataforma web de jogos.">
<meta name="theme-color" content="#0a0e1f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   JOGOTECA v3.1 — layout do protótipo do Figma (6 telas)
   com o visual neon de portal de jogos. Mobile-first.
   Todas as cores ficam aqui: mude aqui e o site acompanha.
   ========================================================= */
:root {
  --fundo: #0a0e1f;
  --painel: #151c3d;
  --painel-2: #1e2752;
  --linha: #2a3468;
  --texto: #eef1ff;
  --texto-suave: #9aa5d6;
  --ciano: #00e5ff;
  --rosa: #ff2e88;
  --roxo: #8b5cff;
  --amarelo: #ffd23f;
  --amarelo-2: #ffb800;
  --sobre-amarelo: #1a1300;
  --verde: #39ff88;

  --f-titulo: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-texto: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --raio: 14px;
  --raio-sm: 10px;
  --tabbar: 64px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--f-texto); font-size: 15px; line-height: 1.5; color: var(--texto);
  background:
    radial-gradient(1100px 560px at 85% -10%, rgba(139, 92, 255, .28), transparent 60%),
    radial-gradient(900px 480px at -10% 15%, rgba(0, 229, 255, .12), transparent 60%),
    var(--fundo);
  background-attachment: fixed;
  padding-bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
}
h1, h2, h3 { margin: 0; font-family: var(--f-titulo); line-height: 1.15; letter-spacing: .01em; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
svg { display: block; }

.wrap {
  width: 100%; max-width: 1140px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main.wrap { padding-block: 18px 40px; outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--ciano); outline-offset: 2px; border-radius: 6px; }

/* ---------- Topo (igual ao Figma: logo + Início / Catálogo / Buscar jogos) ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(10, 14, 31, .9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--linha);
}
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.logo__mark {
  display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px;
  background: linear-gradient(135deg, var(--ciano), var(--roxo) 60%, var(--rosa));
  color: #fff; font-size: 17px; box-shadow: 0 0 16px rgba(0, 229, 255, .45);
}
.logo__text { font-family: var(--f-titulo); font-weight: 700; font-size: 19px; letter-spacing: .08em; }
.topnav { display: none; gap: 6px; }
.topnav a { text-decoration: none; font-weight: 600; font-size: 14px; color: var(--texto-suave); padding: 8px 12px; border-radius: 8px; }
.topnav a:hover { color: var(--texto); background: var(--painel-2); }
.topnav a[aria-current="page"] { color: var(--ciano); box-shadow: inset 0 -2px 0 var(--ciano); border-radius: 0; }

/* ---------- Barra inferior (só celular) ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  height: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px));
  padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  background: rgba(10, 14, 31, .96); backdrop-filter: blur(12px); border-top: 1px solid var(--linha);
}
.tabbar a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 12px; font-weight: 600; color: var(--texto-suave); }
.tabbar svg { width: 22px; height: 22px; fill: currentColor; }
.tabbar a[aria-current="page"] { color: var(--ciano); }
.tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--ciano); box-shadow: 0 0 12px var(--ciano); }

/* ---------- Botões (amarelo = ação principal, como no Figma) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 20px; border: 0; border-radius: var(--raio-sm);
  font-family: var(--f-titulo); font-weight: 700; font-size: 15px; letter-spacing: .03em;
  text-decoration: none; cursor: pointer; transition: transform .12s, box-shadow .2s, filter .2s, border-color .2s;
}
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; fill: currentColor; }
.btn--primario { background: linear-gradient(180deg, var(--amarelo), var(--amarelo-2)); color: var(--sobre-amarelo); box-shadow: 0 6px 22px rgba(255, 210, 63, .3); }
.btn--primario:hover { filter: brightness(1.06); box-shadow: 0 8px 28px rgba(255, 210, 63, .45); }
.btn--claro { background: var(--painel-2); color: var(--texto); border: 1px solid var(--linha); }
.btn--claro:hover { border-color: var(--ciano); }
.acoes { display: flex; flex-wrap: wrap; gap: 10px; }
.acoes--rodape { margin-top: 24px; }
.sobretitulo { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ciano); }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden; display: grid; gap: 16px;
  padding: 24px 20px; border-radius: var(--raio);
  background: linear-gradient(135deg, #1b1550 0%, #2a1170 45%, #0e3a6e 100%);
  border: 1px solid var(--linha);
  box-shadow: 0 20px 60px rgba(139, 92, 255, .25);
}
.hero::before { /* grade neon no chão */
  content: ""; position: absolute; left: -10%; right: -10%; bottom: -20%; height: 60%;
  background:
    repeating-linear-gradient(90deg, rgba(0,229,255,.22) 0 1px, transparent 1px 40px),
    repeating-linear-gradient(0deg, rgba(0,229,255,.22) 0 1px, transparent 1px 22px);
  transform: perspective(260px) rotateX(58deg); transform-origin: top;
  mask-image: linear-gradient(transparent, #000 50%);
  pointer-events: none;
}
.hero__texto { position: relative; z-index: 1; min-width: 0; }
.hero h1 { font-size: 30px; margin: 8px 0 10px; }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--ciano), var(--rosa)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero__texto > p:not(.sobretitulo) { color: #c9cff2; margin-bottom: 18px; max-width: 46ch; }
.hero__texto .acoes .btn { flex: 1 1 auto; }

/* arte do hero: o "disco" do Figma, agora com brilho neon */
.hero__arte { position: absolute; right: -50px; top: -40px; width: 220px; height: 200px; opacity: .3; pointer-events: none; }
.hero__arte span { position: absolute; border-radius: 50%; }
.hero__disco  { right: 10%; top: 0; width: 170px; height: 170px; background: radial-gradient(circle, var(--ciano), #0086a8); box-shadow: 0 0 50px rgba(0,229,255,.7); }
.hero__anel   { right: calc(10% + 40px); top: 40px; width: 90px; height: 90px; background: var(--amarelo); box-shadow: 0 0 30px rgba(255,210,63,.7); }
.hero__nucleo { right: calc(10% + 67px); top: 67px; width: 36px; height: 36px; background: #1b1550; }
.hero__bolha  { right: calc(10% + 160px); top: 90px; width: 48px; height: 48px; background: var(--rosa); box-shadow: 0 0 24px var(--rosa); opacity: .9; }
.hero__arte .hero__linha { right: 6%; bottom: 0; width: 190px; height: 6px; border-radius: 3px; background: var(--amarelo); box-shadow: 0 0 16px var(--amarelo); }

/* ---------- Seções e grade (4 por linha no desktop, como no Figma) ---------- */
.secao { margin-top: 30px; }
.secao__cab { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.secao__cab h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
.secao__cab h2::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--grad, linear-gradient(var(--ciano), var(--roxo))); box-shadow: 0 0 10px var(--ciano); }
.secao__cab p { font-size: 13px; color: var(--texto-suave); text-align: right; }

.grade { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grade > li { position: relative; min-width: 0; }

.card {
  display: flex; flex-direction: column; height: 100%; text-decoration: none;
  background: var(--painel); border: 1px solid var(--linha); border-radius: var(--raio-sm); overflow: hidden;
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--ciano); box-shadow: 0 12px 30px rgba(0, 229, 255, .2); }
.card__info { display: grid; gap: 2px; padding: 10px 12px 12px; min-width: 0; }
.card__titulo { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card__genero { font-size: 12px; color: var(--texto-suave); }

/* botão "jogar" que aparece sobre a capa (padrão dos portais de jogos web) */
.card__play {
  position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px;
  display: grid; place-items: center; border-radius: 50%;
  background: var(--amarelo); color: var(--sobre-amarelo); box-shadow: 0 0 24px rgba(255, 210, 63, .7);
  opacity: 0; transform: scale(.7); transition: opacity .18s, transform .18s;
}
.card__play svg { width: 22px; height: 22px; fill: currentColor; margin-left: 3px; }
.card:hover .card__play, .card:focus-visible .card__play { opacity: 1; transform: scale(1); }

/* coração da lista de desejos no canto da capa (como na loja Steam) */
.coracao {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  background: rgba(10, 14, 31, .7); border: 1px solid rgba(255,255,255,.18); cursor: pointer;
  backdrop-filter: blur(6px);
}
.coracao svg { width: 17px; height: 17px; fill: none; stroke: #fff; stroke-width: 2; }
.coracao[aria-pressed="true"] { background: var(--rosa); border-color: var(--rosa); box-shadow: 0 0 14px var(--rosa); }
.coracao[aria-pressed="true"] svg { fill: #fff; }

/* ---------- Capa gerada em CSS (formas do Figma + brilho) ---------- */
.capa { position: relative; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: linear-gradient(135deg, var(--c1), var(--c2)); isolation: isolate; }
.capa span { position: absolute; }
.capa__circulo { right: -14%; top: -30%; width: 58%; aspect-ratio: 1; border-radius: 50%; background: var(--c3); box-shadow: 0 0 40px var(--c3); z-index: -1; }
.capa__bolha { left: 7%; bottom: 10%; width: 20%; aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, .16); z-index: -1; }
.capa__faixa { left: 0; right: 0; bottom: 14%; height: 4%; background: var(--c3); opacity: .85; z-index: -1; }
.capa__titulo {
  left: 8%; right: 38%; top: 18%;
  font-family: var(--f-titulo); font-weight: 700; color: #fff; text-transform: uppercase;
  font-size: clamp(12px, 3.4vw, 16px); line-height: 1.05; letter-spacing: .02em;
  text-shadow: 0 2px 0 rgba(0,0,0,.35), 0 0 16px rgba(0,0,0,.4);
}
.capa__icone { right: 13%; top: 34%; width: 18%; aspect-ratio: 1; }
.capa__icone svg { width: 100%; height: 100%; fill: rgba(255,255,255,.85); filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
.selo { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 5px; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; vertical-align: 1px; background: var(--rosa); color: #fff; }
.selo--novo { background: var(--verde); color: #04210f; }
.capa--grande { aspect-ratio: 16 / 10; border-radius: var(--raio); border: 1px solid var(--linha); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.capa--grande .capa__circulo { right: -10%; top: -38%; width: 62%; }
.capa--grande .capa__bolha { left: 8%; bottom: 12%; width: 20%; }
.capa--grande .capa__titulo { top: auto; bottom: 18%; right: 40%; font-size: clamp(26px, 8vw, 44px); }

/* ---------- Páginas internas ---------- */
.cab-pagina { margin-bottom: 18px; }
.cab-pagina h1 { font-size: 28px; margin-bottom: 6px; }
.cab-pagina p { font-size: 14px; color: var(--texto-suave); }

.busca {
  display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; margin-bottom: 14px;
  background: var(--painel); border: 1px solid var(--linha); border-radius: var(--raio-sm);
}
.busca:focus-within { border-color: var(--ciano); box-shadow: 0 0 0 3px rgba(0, 229, 255, .22); }
.busca svg { width: 18px; height: 18px; fill: var(--texto-suave); flex: none; }
.busca input { flex: 1; min-width: 0; height: 42px; border: 0; background: transparent; outline: none; font: 16px var(--f-texto); color: var(--texto); }
.busca input::placeholder { color: var(--texto-suave); }
.busca .btn { min-height: 42px; padding: 0 16px; font-size: 14px; }

/* chips de gênero (navegação por categoria) */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 0 14px; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--linha); background: var(--painel); color: var(--texto-suave); font-weight: 600; font-size: 13px; text-decoration: none; white-space: nowrap; }
.chip:hover { color: var(--texto); border-color: var(--ciano); }
.chip[aria-current="page"] { background: linear-gradient(135deg, var(--ciano), var(--roxo)); color: #fff; border-color: transparent; }

.meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; margin-bottom: 12px; font-size: 13px; color: var(--texto-suave); }
.vazio { padding: 26px 16px; text-align: center; color: var(--texto-suave); background: var(--painel); border: 1px dashed var(--linha); border-radius: var(--raio); }
.vazio strong { display: block; color: var(--texto); font-family: var(--f-titulo); font-size: 18px; margin-bottom: 4px; }
.link-texto { background: none; border: 0; padding: 0; color: var(--ciano); font-weight: 700; text-decoration: underline; cursor: pointer; }

/* ---------- Paginação ---------- */
.pag { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
.pag__item { display: inline-grid; place-items: center; min-width: 44px; min-height: 42px; padding: 0 14px; border-radius: var(--raio-sm); background: var(--painel); border: 1px solid var(--linha); font-weight: 700; text-decoration: none; }
.pag__item:hover { border-color: var(--ciano); }
.pag__item--ativo { background: linear-gradient(180deg, var(--amarelo), var(--amarelo-2)); border-color: transparent; color: var(--sobre-amarelo); }
.pag__item--desab { opacity: .4; pointer-events: none; }
.nota-pag { margin-top: 14px; font-size: 12px; color: var(--texto-suave); text-align: center; }

/* ---------- Detalhes ---------- */
.migalhas { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--texto-suave); margin-bottom: 14px; }
.migalhas a { text-decoration: none; }
.migalhas a:hover { color: var(--ciano); }
.detalhe { display: grid; gap: 20px; }
.detalhe__info { display: grid; gap: 12px; min-width: 0; align-content: start; }
.detalhe h1 { font-size: 34px; }
.detalhe__descricao { color: #c9cff2; max-width: 60ch; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--painel-2); color: var(--texto-suave); text-decoration: none; }
a.tag:hover { color: var(--ciano); }
.ficha { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14px; padding: 14px; background: var(--painel); border: 1px solid var(--linha); border-radius: var(--raio-sm); }
.ficha dt { color: var(--texto-suave); }
.ficha dd { margin: 0; font-weight: 700; }
.disp { color: var(--verde); }
.detalhe .acoes .btn { flex: 1 1 auto; }
.aviso { margin-top: 24px; padding: 16px; border-radius: var(--raio-sm); border: 1px solid var(--linha); background: linear-gradient(135deg, rgba(139,92,255,.14), rgba(0,229,255,.06)); }
.aviso h2 { font-size: 15px; margin-bottom: 4px; }
.aviso p { font-size: 13px; color: var(--texto-suave); }

/* ---------- Acesso ---------- */
.palco {
  position: relative; overflow: hidden; display: grid; place-items: center; align-content: center; text-align: center; gap: 12px;
  min-height: 300px; padding: 32px 20px; margin-bottom: 20px; border-radius: var(--raio);
  background: linear-gradient(135deg, var(--c1), var(--c2)); border: 1px solid var(--linha);
}
.palco__estrela { font-size: 40px; color: #fff; text-shadow: 0 0 24px var(--ciano); animation: pulsar 2s ease-in-out infinite; }
.palco h2 { font-size: 30px; text-transform: uppercase; }
.palco p { color: rgba(255,255,255,.85); font-size: 14px; }
.carregando { width: min(280px, 80%); height: 10px; border-radius: 5px; background: rgba(0,0,0,.35); overflow: hidden; }
.carregando span { display: block; height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, var(--ciano), var(--verde)); box-shadow: 0 0 14px var(--verde); animation: carregar 2s ease-out forwards; }
@keyframes carregar { to { width: 100%; } }
@keyframes pulsar { 50% { transform: scale(1.15); opacity: .8; } }

.rodape { margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--linha); font-size: 12px; color: var(--texto-suave); text-align: center; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition: none !important; }
}

/* =========================================================
   Tablet (≥600px)
   ========================================================= */
@media (min-width: 600px) {
  .grade { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .hero { grid-template-columns: 1.4fr 1fr; align-items: center; padding: 32px; }
  .hero__arte { position: relative; right: auto; top: auto; width: auto; height: 190px; opacity: 1; }
  .hero__texto .acoes .btn { flex: 0 0 auto; }
  .hero h1 { font-size: 36px; }
  .detalhe { grid-template-columns: minmax(240px, 1fr) 1.1fr; align-items: start; gap: 28px; }
  .capa--grande { aspect-ratio: 1 / 1; }
  .capa--grande .capa__circulo { right: -22%; top: -22%; width: 85%; }
  .capa--grande .capa__bolha { left: 12%; bottom: 18%; width: 28%; }
  .capa--grande .capa__titulo { bottom: 34%; right: 18%; font-size: 40px; }
  .detalhe .acoes .btn { flex: 0 0 auto; }
}

/* =========================================================
   Desktop (≥900px): menu no topo, some a barra inferior
   ========================================================= */
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  .tabbar { display: none; }
  .topnav { display: flex; }
  .topbar .wrap { height: 66px; }
  main.wrap { padding-block: 28px 56px; }
  .grade { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; }
  .hero { padding: 40px 44px; }
  .hero h1 { font-size: 44px; }
  .hero__arte { height: 220px; }
  .cab-pagina h1 { font-size: 34px; }
  .detalhe { grid-template-columns: 380px 1fr; gap: 36px; }
  .detalhe h1 { font-size: 44px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a class="logo" href="#inicio" aria-label="Jogoteca, ir para o início">
      <span class="logo__mark" aria-hidden="true">✦</span><span class="logo__text">JOGOTECA</span>
    </a>
    <nav class="topnav" aria-label="Principal">
      <a href="#inicio" data-nav="inicio">Início</a>
      <a href="#catalogo" data-nav="catalogo">Catálogo</a>
      <a href="#busca" data-nav="busca">Buscar jogos</a>
    </nav>
  </div>
</header>

<main id="conteudo" class="wrap" tabindex="-1"></main>

<nav class="tabbar" aria-label="Navegação rápida">
  <a href="#inicio" data-nav="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></a>
  <a href="#catalogo" data-nav="catalogo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Catálogo</span></a>
  <a href="#busca" data-nav="busca"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><span>Buscar</span></a>
</nav>

<script>
/* =========================================================
   DADOS — os 24 jogos fictícios do protótipo.
   [slug, título, gênero, classificação, cor1, cor2, cor do círculo, descrição]
   Para adicionar um jogo, copie uma linha e troque os dados.
   ========================================================= */
const JOGOS = [
  ["astro-arena","Astro Arena","Ação","12 anos","#2b1055","#c21f6e","#ffd23f","Duelos rápidos em arenas flutuantes no meio de um cinturão de asteroides."],
  ["astro-lab","Astro Lab","Estratégia","Livre","#0b2e6e","#0aa2c0","#ffe27a","Monte um laboratório orbital e pesquise tecnologias para colonizar novos planetas."],
  ["astro-voyage","Astro Voyage","Exploração","Livre","#1a0b4f","#5b3bd6","#ffd23f","Uma viagem tranquila por sistemas solares desconhecidos, catalogando cada descoberta."],
  ["castelo-das-nuvens","Castelo das Nuvens","Estratégia","10 anos","#0e4a7a","#2b8fd6","#ffe27a","Defenda um castelo suspenso no céu organizando recursos e aliados."],
  ["circuito-neon","Circuito Neon","Corrida","Livre","#14002e","#b0136a","#00e5ff","Corridas noturnas em pistas iluminadas, com atalhos que mudam a cada volta."],
  ["floresta-luminosa","Floresta Luminosa","Exploração","Livre","#03301d","#0f9a5f","#ffe27a","Explore uma floresta que brilha à noite e descubra os segredos de suas criaturas."],
  ["jardim-de-cristal","Jardim de Cristal","Simulação","Livre","#0b3f4a","#13a3a3","#ff8bd1","Cultive plantas de cristal e transforme um terreno vazio num jardim premiado."],
  ["labirinto-prisma","Labirinto Prisma","Quebra-cabeça","Livre","#2d0a5e","#7a3bff","#ffd23f","Redirecione feixes de luz para abrir passagens num labirinto de espelhos."],
  ["mare-de-neon","Maré de Neon","Arcade","Livre","#001d4a","#0072d6","#ff2e88","Surfe ondas de luz e acumule pontos num arcade de ritmo acelerado."],
  ["mundo-de-origami","Mundo de Origami","Casual","Livre","#4a1500","#d6541f","#ffe0b3","Dobre papéis para criar pontes, barcos e caminhos num mundo feito de origami."],
  ["orbita-zero","Órbita Zero","Aventura espacial","10 anos","#0a0e3f","#3a2bff","#00e5ff","Viaje entre mundos, descubra ruínas cósmicas e explore um universo repleto de mistérios. Um jogo fictício criado para demonstrar o protótipo."],
  ["pixel-rush","Pixel Rush","Plataforma","Livre","#3d0040","#b81fa8","#39ff88","Plataforma clássica em pixel art, com fases curtas e desafios cronometrados."],
  ["portais-do-tempo","Portais do Tempo","Aventura","10 anos","#2a1200","#c4620f","#b89bff","Atravesse portais para diferentes épocas e corrija falhas na linha do tempo."],
  ["rota-astral","Rota Astral","Aventura","10 anos","#00264d","#0a7fb8","#ffd23f","Trace rotas entre constelações e guie uma nave de carga até o destino."],
  ["ruinas-do-sol","Ruínas do Sol","Ação","12 anos","#4a0d00","#c43a0f","#ffd23f","Enfrente guardiões antigos em templos escondidos sob o deserto."],
  ["saltos-da-lua","Saltos da Lua","Plataforma","Livre","#151a3d","#4b58c4","#e6e9ff","Pule entre crateras com gravidade reduzida e colete fragmentos lunares."],
  ["torre-esmeralda","Torre Esmeralda","Estratégia","10 anos","#003322","#079e6b","#ffd23f","Construa andar por andar uma torre defensiva contra ondas de invasores."],
  ["trilha-cosmica","Trilha Cósmica","Corrida","Livre","#1c0040","#8a1fd6","#00e5ff","Corridas em trilhas espaciais com curvas impossíveis e turbo de cometas."],
  ["vale-das-estrelas","Vale das Estrelas","Aventura","Livre","#0d0a3a","#3b2bc4","#ffd23f","Acompanhe uma pequena exploradora num vale onde as estrelas caem toda noite."],
  ["vila-dos-ventos","Vila dos Ventos","Simulação","Livre","#003a4d","#1592b8","#b6ff5c","Administre uma vila movida a cata-ventos e mantenha todos felizes."],
  ["voo-livre","Voo Livre","Aventura","Livre","#00345c","#2e86c4","#ffffff","Plane sobre ilhas flutuantes e descubra caminhos escondidos entre as nuvens."],
  ["xadrez-lunar","Xadrez Lunar","Estratégia","Livre","#111633","#3e4aa8","#e6e9ff","Uma variação do xadrez jogada num tabuleiro que muda com as fases da lua."],
  ["ypsilon-quest","Ypsilon Quest","Quebra-cabeça","Livre","#3b0030","#c4176a","#39ffd2","Resolva enigmas lógicos para atravessar um mundo em forma de letra Y."],
  ["zenite-azul","Zênite Azul","Ação","12 anos","#001a5c","#0050c4","#00e5ff","Combates aéreos no ponto mais alto do céu, sobre um oceano sem fim."]
].map(([slug, titulo, genero, classificacao, c1, c2, c3, descricao]) => ({ slug, titulo, genero, classificacao, c1, c2, c3, descricao }));

const porSlug = (slug) => JOGOS.find((j) => j.slug === slug);

/* Seções da página inicial — as mesmas do Figma */
const SECOES_HOME = [
  { titulo: "Jogos em destaque", subtitulo: "Escolhas especiais da plataforma", cor: "linear-gradient(var(--amarelo), var(--rosa))", slugs: ["orbita-zero", "floresta-luminosa", "circuito-neon", "castelo-das-nuvens"] },
  { titulo: "Mais acessados", subtitulo: "Os favoritos da comunidade", cor: "linear-gradient(var(--ciano), var(--verde))", slugs: ["astro-arena", "pixel-rush", "rota-astral", "labirinto-prisma"] },
  { titulo: "Novidades", subtitulo: "Os jogos adicionados recentemente", cor: "linear-gradient(var(--roxo), var(--ciano))", slugs: ["astro-lab", "jardim-de-cristal", "mare-de-neon", "vale-das-estrelas"] }
];

/* Ícone de cada gênero, desenhado na capa (inspirado nos portais de jogos web) */
const ICONES = {
  "Ação": "M6.9 2 2 6.9l4.3 4.3-2.6 2.6 1.4 1.4 2.6-2.6 2.1 2.1-3.5 3.5 2.8 2.8 3.5-3.5 4.2 4.2 1.4-1.4-4.2-4.2 3.5-3.5-2.8-2.8-3.5 3.5-2.1-2.1 2.6-2.6-1.4-1.4-2.6 2.6z",
  "Estratégia": "M7 21h10v-2H7zm1-4h8l1-9-3 2-2-5-2 5-3-2z",
  "Exploração": "M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm3.5 6.5-2 5-5 2 2-5z",
  "Corrida": "M5 13l1.5-4.5A2 2 0 0 1 8.4 7h7.2a2 2 0 0 1 1.9 1.5L19 13v6h-2v-2H7v2H5zm2.5 1.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm9 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM7.3 11h9.4l-1-3H8.3z",
  "Simulação": "M12 3l9 7v11h-6v-6H9v6H3V10z",
  "Quebra-cabeça": "M10 3a2 2 0 0 1 4 0v2h5v5h-2a2 2 0 0 0 0 4h2v5h-5v-2a2 2 0 0 0-4 0v2H5v-5h2a2 2 0 0 0 0-4H5V5h5z",
  "Arcade": "M7 6h10a5 5 0 0 1 0 10h-1l-2 2h-4l-2-2H7A5 5 0 0 1 7 6zm0 3v2H5v2h2v2h2v-2h2v-2H9V9zm9 0a1.2 1.2 0 1 0 0 2.4A1.2 1.2 0 0 0 16 9zm2 3a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z",
  "Casual": "M12 2l2.9 6.9L22 9.3l-5.4 4.8L18.2 21 12 17.3 5.8 21l1.6-6.9L2 9.3l7.1-.4z",
  "Plataforma": "M3 18h6v3H3zm6-5h6v3H9zm6-5h6v3h-6zM6 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4z",
  "Aventura": "M3 20l6.5-11 4 6.5L16 12l5 8z",
  "Aventura espacial": "M12 2c3 2 5 6 5 10l2 3v4l-4-2H9l-4 2v-4l2-3c0-4 2-8 5-10zm0 7a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"
};

/* Selos dos cards: "Novo" = seção Novidades; "Em alta" = seção Mais acessados */
const NOVOS = new Set(SECOES_HOME[2].slugs);
const EM_ALTA = new Set(SECOES_HOME[1].slugs);

/* =========================================================
   APP — rotas pelo # do endereço
   #inicio · #catalogo · #catalogo-2 · #genero-acao · #busca
   #jogo-<slug> · #acesso-<slug>
   ========================================================= */
(function () {
  "use strict";
  const POR_PAGINA = 20;
  const app = document.getElementById("conteudo");
  let termoBusca = "astro"; // exemplo inicial, como no Figma

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const normalizar = (s) => s.normalize("NFD").replace(/\p{M}/gu, "").toLowerCase().trim();
  const generoBase = (g) => g.split(" ")[0];
  const slugGenero = (g) => normalizar(generoBase(g));
  const ordenados = [...JOGOS].sort((a, b) => a.titulo.localeCompare(b.titulo, "pt-BR", { sensitivity: "base" }));
  const GENEROS = [...new Set(JOGOS.map((j) => generoBase(j.genero)))].sort((a, b) => a.localeCompare(b, "pt-BR"));
  const totalPaginas = Math.ceil(ordenados.length / POR_PAGINA);

  /* lista de desejos: fica salva no navegador, se ele permitir */
  let desejos = new Set();
  try { desejos = new Set(JSON.parse(localStorage.getItem("jogoteca-desejos") || "[]")); } catch (e) {}
  const salvar = () => { try { localStorage.setItem("jogoteca-desejos", JSON.stringify([...desejos])); } catch (e) {} };

  const svgPlay = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
  const svgCoracao = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.3-4.4-9.3-8.9C1.3 8.4 3.3 5 6.6 5c2 0 3.5 1.1 4.3 2.5h2.2C13.9 6.1 15.4 5 17.4 5c3.3 0 5.3 3.4 3.9 6.6-2 4.5-9.3 8.9-9.3 8.9z"/></svg>';

  function capa(j, grande = false) {
    return `
      <div class="capa${grande ? " capa--grande" : ""}" style="--c1:${j.c1};--c2:${j.c2};--c3:${j.c3}" aria-hidden="true">
        <span class="capa__circulo"></span><span class="capa__bolha"></span>${grande ? "" : '<span class="capa__faixa"></span>'}
        <span class="capa__icone"><svg viewBox="0 0 24 24"><path d="${ICONES[j.genero] || ICONES["Casual"]}"/></svg></span>
        <span class="capa__titulo">${esc(j.titulo)}</span>
      </div>`;
  }

  function botaoDesejo(j) {
    const on = desejos.has(j.slug);
    return `<button type="button" class="coracao" data-desejo="${j.slug}" aria-pressed="${on}" aria-label="${on ? "Tirar" : "Pôr"} ${esc(j.titulo)} na lista de desejos">${svgCoracao}</button>`;
  }

  function card(j) {
    return `
      <li>
        <a class="card" href="#jogo-${j.slug}">
          <span style="position:relative;display:block">${capa(j)}<span class="card__play" aria-hidden="true">${svgPlay}</span></span>
          <span class="card__info">
            <span class="card__titulo">${esc(j.titulo)}</span>
            <span class="card__genero">${esc(j.genero)}${NOVOS.has(j.slug) ? '<span class="selo selo--novo">Novo</span>' : EM_ALTA.has(j.slug) ? '<span class="selo">Em alta</span>' : ""}</span>
          </span>
        </a>
        ${botaoDesejo(j)}
      </li>`;
  }
  const grade = (lista) => `<ul class="grade" role="list">${lista.map(card).join("")}</ul>`;

  function formBusca(valor, rotulo) {
    return `
      <form class="busca" role="search" data-busca>
        <label class="sr-only" for="campo-busca">Buscar por nome ou parte do título</label>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg>
        <input id="campo-busca" name="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="Buscar por nome ou parte do título..." value="${esc(valor)}">
        <button class="btn btn--primario" type="submit">${rotulo}</button>
      </form>`;
  }

  function chips(ativo) {
    return `<nav class="chips" aria-label="Gêneros">
      <a class="chip" href="#catalogo"${!ativo ? ' aria-current="page"' : ""}>Todos</a>
      <a class="chip" href="#desejos"${ativo === "desejos" ? ' aria-current="page"' : ""}>♥ Desejos${desejos.size ? ` (${desejos.size})` : ""}</a>
      ${GENEROS.map((g) => `<a class="chip" href="#genero-${normalizar(g)}"${ativo === normalizar(g) ? ' aria-current="page"' : ""}>${esc(g)}</a>`).join("")}
    </nav>`;
  }

  /* ---------- 01 · HOME ---------- */
  function telaInicio() {
    return {
      nav: "inicio", titulo: "Início",
      html: `
        <section class="hero">
          <div class="hero__texto">
            <p class="sobretitulo">Experiência digital • Catálogo de jogos</p>
            <h1>Descubra seu próximo <em>jogo favorito.</em></h1>
            <p>Explore títulos em destaque, descubra novidades e navegue por uma coleção de aventuras.</p>
            <div class="acoes">
              <a class="btn btn--primario" href="#catalogo">Explorar catálogo <span aria-hidden="true">→</span></a>
              <a class="btn btn--claro" href="#jogo-orbita-zero">Ver jogo em destaque</a>
            </div>
          </div>
          <div class="hero__arte" aria-hidden="true"><span class="hero__disco"></span><span class="hero__anel"></span><span class="hero__nucleo"></span><span class="hero__bolha"></span><span class="hero__linha"></span></div>
        </section>
        ${SECOES_HOME.map((s) => `
          <section class="secao" style="--grad:${s.cor}">
            <div class="secao__cab"><h2>${esc(s.titulo)}</h2><p>${esc(s.subtitulo)}</p></div>
            ${grade(s.slugs.map(porSlug))}
          </section>`).join("")}
        <p class="rodape">Jogoteca · Protótipo acadêmico com jogos fictícios.</p>`
    };
  }

  /* ---------- 02 · CATÁLOGO (página 1 e 2) e filtro por gênero ---------- */
  function paginacao(atual, total) {
    if (total <= 1) return "";
    const href = (n) => (n === 1 ? "#catalogo" : `#catalogo-${n}`);
    let html = `<a class="pag__item${atual === 1 ? " pag__item--desab" : ""}" href="${href(atual - 1)}">Anterior</a>`;
    for (let n = 1; n <= total; n++) html += `<a class="pag__item${n === atual ? " pag__item--ativo" : ""}" href="${href(n)}"${n === atual ? ' aria-current="page"' : ""}>${n}</a>`;
    html += `<a class="pag__item${atual === total ? " pag__item--desab" : ""}" href="${href(atual + 1)}">Próxima</a>`;
    return `<nav class="pag" aria-label="Paginação">${html}</nav>`;
  }

  function telaCatalogo(pagina) {
    pagina = Math.min(Math.max(pagina, 1), totalPaginas);
    const lista = ordenados.slice((pagina - 1) * POR_PAGINA, pagina * POR_PAGINA);
    return {
      nav: "catalogo", titulo: `Catálogo, página ${pagina}`,
      html: `
        <header class="cab-pagina">
          <h1>Catálogo de jogos</h1>
          <p>${pagina === 1 ? "Explore toda a coleção. Organize, pesquise e encontre sua próxima aventura." : `Página ${pagina} · Continuação alfabética da coleção fictícia`}</p>
        </header>
        ${pagina === 1 ? formBusca("", "Buscar") : ""}
        ${chips("")}
        <div class="meta"><span>${POR_PAGINA} jogos por página • Ordem alfabética (A–Z)</span><span>Página ${pagina} de ${totalPaginas} • ${ordenados.length} jogos fictícios</span></div>
        ${grade(lista)}
        ${paginacao(pagina, totalPaginas)}
        ${pagina === totalPaginas ? `<p class="nota-pag">Exemplo para demonstrar a paginação: ${ordenados.length} jogos fictícios, ${POR_PAGINA} na primeira página e ${ordenados.length - POR_PAGINA} na segunda.</p>` : ""}`
    };
  }

  function telaGenero(slug) {
    const nome = GENEROS.find((g) => normalizar(g) === slug);
    if (!nome) return telaCatalogo(1);
    const lista = ordenados.filter((j) => slugGenero(j.genero) === slug);
    return {
      nav: "catalogo", titulo: `Jogos de ${nome}`,
      html: `
        <header class="cab-pagina"><h1>Catálogo de jogos</h1><p>Gênero: ${esc(nome)}</p></header>
        ${chips(slug)}
        <div class="meta"><span>${lista.length} ${lista.length === 1 ? "jogo" : "jogos"} • Ordem alfabética (A–Z)</span></div>
        ${grade(lista)}`
    };
  }

  function telaDesejos() {
    const lista = ordenados.filter((j) => desejos.has(j.slug));
    return {
      nav: "catalogo", titulo: "Lista de desejos",
      html: `
        <header class="cab-pagina"><h1>Catálogo de jogos</h1><p>Sua lista de desejos (fica salva neste aparelho).</p></header>
        ${chips("desejos")}
        ${lista.length ? `<div class="meta"><span>${lista.length} ${lista.length === 1 ? "jogo" : "jogos"} na lista</span></div>${grade(lista)}`
          : `<div class="vazio"><strong>Sua lista está vazia</strong>Toque no coração de um jogo para guardar ele aqui.</div>`}`
    };
  }

  /* ---------- 03 · BUSCA ---------- */
  function telaBusca() {
    const termo = termoBusca.trim(), n = normalizar(termo);
    const res = n ? ordenados.filter((j) => normalizar(j.titulo).includes(n)) : [];
    let corpo;
    if (!termo) corpo = `<div class="vazio"><strong>Digite o nome de um jogo</strong>Exemplo: <button type="button" class="link-texto" data-exemplo="astro">astro</button></div>`;
    else if (!res.length) corpo = `<div class="vazio"><strong>Nenhum jogo encontrado para “${esc(termo)}”</strong>Tente outro trecho do título.</div>`;
    else corpo = `<div class="meta"><span>${res.length} ${res.length === 1 ? "jogo encontrado" : "jogos encontrados"} • Os resultados aparecem em ordem alfabética</span></div>${grade(res)}`;
    return {
      nav: "busca", titulo: "Resultados da busca",
      html: `
        <header class="cab-pagina">
          <h1>Resultados da busca</h1>
          <p>${termo ? `Pesquisa por trecho do título: “${esc(termo)}”.` : "Pesquise por trecho do título."}</p>
        </header>
        ${formBusca(termo, "Pesquisar")}
        <div aria-live="polite">${corpo}</div>
        <div class="acoes acoes--rodape"><a class="btn btn--claro" href="#catalogo">Voltar ao catálogo</a></div>`
    };
  }

  /* ---------- 04 · DETALHES ---------- */
  function telaDetalhes(j) {
    const on = desejos.has(j.slug);
    return {
      nav: "catalogo", titulo: j.titulo,
      html: `
        <nav class="migalhas" aria-label="Você está em">
          <a href="#inicio">Início</a><span aria-hidden="true">/</span>
          <a href="#catalogo">Catálogo</a><span aria-hidden="true">/</span>
          <span aria-current="page">${esc(j.titulo)}</span>
        </nav>
        <article class="detalhe">
          ${capa(j, true)}
          <div class="detalhe__info">
            <p class="sobretitulo">${esc(generoBase(j.genero))} • <span class="disp">Disponível</span></p>
            <h1>${esc(j.titulo)}</h1>
            <p class="detalhe__descricao">${esc(j.descricao)}</p>
            <div class="tags">
              <a class="tag" href="#genero-${slugGenero(j.genero)}">${esc(j.genero)}</a>
              <span class="tag">Navegador</span><span class="tag">Celular e PC</span>
            </div>
            <dl class="ficha">
              <dt>Gênero</dt><dd>${esc(j.genero)}</dd>
              <dt>Classificação etária</dt><dd>${esc(j.classificacao)}</dd>
              <dt>Disponibilidade</dt><dd class="disp">Disponível</dd>
            </dl>
            <div class="acoes">
              <a class="btn btn--primario" href="#acesso-${j.slug}">${svgPlay} Jogar agora</a>
              <a class="btn btn--claro" href="#catalogo">Voltar ao catálogo</a>
              <button type="button" class="btn btn--claro" data-desejo="${j.slug}" aria-pressed="${on}">${on ? "♥ Na lista de desejos" : "♡ Lista de desejos"}</button>
            </div>
          </div>
        </article>
        <aside class="aviso">
          <h2>Fluxo demonstrativo</h2>
          <p>A navegação e a abertura do jogo são simuladas. O registro real de acessos depende de uma implementação futura.</p>
        </aside>`
    };
  }

  /* ---------- 05 · ACESSO ---------- */
  function telaAcesso(j) {
    return {
      nav: "catalogo", titulo: `Acesso: ${j.titulo}`,
      html: `
        <header class="cab-pagina">
          <h1>Acesso ao jogo</h1>
          <p>Esta tela simula a abertura do endereço de um jogo pelo navegador.</p>
        </header>
        <section class="palco" style="--c1:${j.c1};--c2:${j.c2}">
          <span class="palco__estrela" aria-hidden="true">✦</span>
          <h2>${esc(j.titulo)}</h2>
          <div class="carregando" role="progressbar" aria-label="Carregando o jogo"><span></span></div>
          <p>Demonstração do fluxo de acesso</p>
        </section>
        <div class="acoes">
          <a class="btn btn--primario" href="#jogo-${j.slug}">Voltar aos detalhes</a>
          <a class="btn btn--claro" href="#inicio">Ir para a Home</a>
        </div>`
    };
  }

  /* ---------- roteador ---------- */
  function rota() {
    const h = location.hash.replace(/^#/, "");
    let m;
    if (!h || h === "inicio") return telaInicio();
    if (h === "catalogo") return telaCatalogo(1);
    if ((m = h.match(/^catalogo-(\d+)$/))) return telaCatalogo(+m[1]);
    if ((m = h.match(/^genero-([a-z-]+)$/))) return telaGenero(m[1]);
    if (h === "busca") return telaBusca();
    if (h === "desejos") return telaDesejos();
    if ((m = h.match(/^(jogo|acesso)-([a-z0-9-]+)$/)) && porSlug(m[2])) {
      return m[1] === "jogo" ? telaDetalhes(porSlug(m[2])) : telaAcesso(porSlug(m[2]));
    }
    return telaInicio();
  }

  let primeira = true;
  function render() {
    const tela = rota();
    app.innerHTML = tela.html;
    document.title = `${tela.titulo} · Jogoteca`;
    document.querySelectorAll("[data-nav]").forEach((a) =>
      a.dataset.nav === tela.nav ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    window.scrollTo(0, 0);
    if (!primeira) app.focus({ preventScroll: true });
    primeira = false;
  }

  function buscar(q) {
    termoBusca = q;
    if (location.hash === "#busca") render(); else location.hash = "busca";
  }

  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-busca]");
    if (!f) return;
    e.preventDefault();
    f.q.blur(); // fecha o teclado no celular
    buscar(f.q.value);
  });

  document.addEventListener("click", (e) => {
    const ex = e.target.closest("[data-exemplo]");
    if (ex) { buscar(ex.dataset.exemplo); return; }
    const d = e.target.closest("[data-desejo]");
    if (!d) return;
    e.preventDefault();
    const s = d.dataset.desejo;
    if (desejos.has(s)) desejos.delete(s); else desejos.add(s);
    salvar();
    const on = desejos.has(s);
    document.querySelectorAll(`[data-desejo="${s}"]`).forEach((b) => {
      b.setAttribute("aria-pressed", String(on));
      if (b.classList.contains("btn")) b.textContent = on ? "♥ Na lista de desejos" : "♡ Lista de desejos";
    });
    if (location.hash === "#desejos") render();
    else document.querySelectorAll('.chip[href="#desejos"]').forEach((c) => { c.textContent = `♥ Desejos${desejos.size ? ` (${desejos.size})` : ""}`; });
  });

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
